name: Next.js Migration Safety

on:
  push:
    branches: [nextjs-migration]
  pull_request:
    branches: [main]
    paths:
      - 'next-app/**'
      - 'index.html'
      - 'services/**'
      - 'solutions/**'
      - 'components/**'
      - 'coatings/**'
      - 'knowledge-center/**'
      - 'parts/**'
      - 'assets/**'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'llms.txt'
      - 'CNAME'

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-app
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next-app/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Build hybrid export and validate SEO route parity
        run: npm run build:safe
      - name: Upload validated site artifact
        uses: actions/upload-artifact@v4
        with:
          name: pharmaglobaleng-nextjs-safe-export
          path: next-app/out
          if-no-files-found: error
          retention-days: 7
