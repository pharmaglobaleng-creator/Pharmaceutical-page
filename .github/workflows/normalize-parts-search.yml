name: Normalize parts for search quality

on:
  push:
    branches: [main]
    paths:
      - 'scripts/normalize_part_pages_for_search.py'
      - 'scripts/enforce_unique_part_titles.py'
      - 'catalog-data/**'
      - 'data/kikusui-parts.csv'
      - 'data/oem-cross-reference-audit.csv'
      - 'parts/**/*.html'
      - '.github/workflows/normalize-parts-search.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pharmaglobaleng-parts-search-quality
  cancel-in-progress: false

jobs:
  normalize-and-audit:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'Normalize part pages for search quality') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Normalize part detail pages
        run: python scripts/normalize_part_pages_for_search.py --fix

      - name: Enforce unique concise titles
        run: python scripts/enforce_unique_part_titles.py

      - name: Run critical quality gate
        run: python scripts/normalize_part_pages_for_search.py --check

      - name: Verify unique concise titles after audit
        run: python scripts/enforce_unique_part_titles.py

      - name: Verify patch formatting
        run: git diff --check

      - name: Commit normalized pages and audit report
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Part pages already satisfy the current search-quality rules."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'parts/**/index.html' 'docs/parts-search-quality-audit.md'
          git commit -m "Normalize part pages for search quality"
          git push origin HEAD:main
