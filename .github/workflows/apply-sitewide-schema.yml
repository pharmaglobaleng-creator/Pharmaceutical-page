name: Apply sitewide schema

on:
  push:
    branches:
      - schema-sitewide
    paths:
      - scripts/apply_sitewide_schema.py
      - .github/workflows/apply-sitewide-schema.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Check out schema branch
        uses: actions/checkout@v4
        with:
          ref: schema-sitewide

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply and validate structured data
        run: python scripts/apply_sitewide_schema.py

      - name: Verify patch formatting
        run: git diff --check

      - name: Commit generated HTML updates
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No schema changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Apply sitewide schema to public HTML pages [skip ci]"
          git push origin HEAD:schema-sitewide
