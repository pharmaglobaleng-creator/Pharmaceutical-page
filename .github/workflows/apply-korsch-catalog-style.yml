name: Apply Korsch Catalog Style
on:
  push:
    paths:
      - '.github/workflows/apply-korsch-catalog-style.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Link catalog stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/css/store.css')
          text = p.read_text()
          line = "\n@import url('/assets/css/korsch-catalog.css');\n"
          if "korsch-catalog.css" not in text:
              p.write_text(text.rstrip() + line)
          PY
      - name: Commit style link
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/store.css
          git commit -m 'Enable premium Korsch catalog styling'
          git push origin main
