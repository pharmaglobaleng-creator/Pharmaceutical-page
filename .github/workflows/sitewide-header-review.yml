name: Verify live approved sitewide header
on:
  push:
    branches: [update/sitewide-header-20260910]
    paths: [.github/workflows/sitewide-header-review.yml]
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          fetch-depth: 1
      - name: Install verification tools
        run: |
          python3 -m pip install requests playwright
          python3 -m playwright install --with-deps chromium
      - name: Wait for the approved header to be published
        run: |
          python3 - <<'PY'
          import requests,time
          urls=['https://pharmaglobaleng.com/about/','https://pharmaglobaleng.com/parts/pge-kik-003/','https://pharmaglobaleng.com/']
          for attempt in range(30):
            try:
              ready=all('data-pge-header="v1"' in requests.get(url,timeout=20).text for url in urls)
            except requests.RequestException:
              ready=False
            if ready:
              print('Approved header is published.');break
            time.sleep(15)
          else:raise SystemExit('The live header has not appeared; no success claimed.')
          PY
      - name: Check live desktop and mobile layouts, menus and quote cart
        run: python3 scripts/test_sitewide_header.py --url https://pharmaglobaleng.com --quick --output /tmp/pge-header-live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-header-live-check
          path: /tmp/pge-header-live/
          retention-days: 14
