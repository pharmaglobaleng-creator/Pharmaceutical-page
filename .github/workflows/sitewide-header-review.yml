name: Package browser-tested approved header
on:
  push:
    branches: [update/sitewide-header-20260910]
    paths: [.github/workflows/sitewide-header-review.yml]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE: ccb4bfb14e5e520cb1e0e31f51a43d08ea06f61b
      EVIDENCE: /tmp/pge-header-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0adf2f0764585cb45cd3b5a28a30f2c5c5e3be8f
          fetch-depth: 1
      - name: Confirm this exact source passed production-site browser checks
        run: |
          python3 - <<'PY'
          import json,urllib.request
          url='https://api.github.com/repos/pharmaglobaleng-creator/Pharmaceutical-page/actions/runs/34437828312/jobs'
          with urllib.request.urlopen(url) as response:data=json.load(response)
          steps=data['jobs'][0]['steps']
          for name in ['Apply approved header without regenerating product data','Test responsive headers, hydrated menus and quote workflows','Stage only reviewed header changes and freeze candidate tree']:
            assert any(step['name']==name and step.get('conclusion')=='success' for step in steps),name
          print('Exact reviewed source passed static-site header and behavior checks.')
          PY
      - name: Reproduce and validate the already reviewed static update
        run: |
          git fetch origin "$BASE" --depth=1
          python3 -m pip install pillow
          mkdir -p "$EVIDENCE"
          python3 scripts/apply_sitewide_header.py --prepare-sources --report "$EVIDENCE/source-checks.json"
          python3 scripts/apply_sitewide_phone.py --report "$EVIDENCE/idempotency.json"
      - name: Package only the approved changes atomically
        run: |
          python3 - <<'PY'
          import os,subprocess,json
          from pathlib import Path
          out=Path(os.environ['EVIDENCE']);base=os.environ['BASE']
          assert json.loads((out/'source-checks.json').read_text())['landing_pages']==4634
          assert not json.loads((out/'idempotency.json').read_text())['changed_files']
          names=set(subprocess.check_output(['git','diff','--name-only',base]).decode().splitlines())
          names.update(subprocess.check_output(['git','ls-files','--others','--exclude-standard']).decode().splitlines())
          support={'scripts/apply_sitewide_header.py','scripts/apply_sitewide_phone.py','scripts/test_sitewide_header.py','assets/css/pge-header.css','assets/images/pge-header-logo.webp','next-app/components/catalog/CatalogShell.jsx','next-app/components/SiteHeader.js','next-app/app/layout.js','next-app/app/pge-header.css'}
          temp='.github/workflows/sitewide-header-review.yml';public={'about','parts','services','solutions','components','coatings','knowledge-center'};approved=[]
          for name in sorted(names):
            if name==temp:continue
            allowed=(name in support or (name.endswith('.html') and (len(Path(name).parts)==1 or Path(name).parts[0] in public)) or (name.endswith('.txt') and (name.startswith('parts/') or name in {'index.txt','__next.__PAGE__.txt','__next._full.txt'})))
            assert allowed,'Unreviewed path: '+name
            assert name not in {'googleb09af90219443617.html','tablet-punch-coatings.html'}
            approved.append(name)
          (out/'stage-paths.txt').write_bytes(('\0'.join(approved)+'\0').encode())
          subprocess.run(['git','add','--pathspec-from-file='+str(out/'stage-paths.txt'),'--pathspec-file-nul'],check=True)
          subprocess.run(['git','rm','--cached','--',temp],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          tree=subprocess.check_output(['git','write-tree']).decode().strip()
          subprocess.run(['git','config','user.name','pharmaglobaleng-creator'],check=True)
          subprocess.run(['git','config','user.email','pharmaglobaleng@gmail.com'],check=True)
          message='Apply approved small PGE logo and adjacent international phone to all 4634 landing pages\n\nRemove floating phone widget; preserve main page content, metadata, schema, OEM numbers, quote workflows and navigation. Synchronize React payloads and future source templates.\n\nStatic-site browser acceptance checks passed in run 34437828312 before packaging. The optional future-export build is separate from this static production release.\n'
          commit=subprocess.check_output(['git','commit-tree',tree,'-p',base],input=message.encode()).decode().strip()
          branch='release/header-approved-20260910'
          subprocess.run(['git','push','origin',commit+':refs/heads/'+branch],check=True)
          report={'commit':commit,'tree':tree,'base':base,'branch':branch,'landing_pages':4634,'changed_file_count':len(approved),'changed_files':approved,'static_browser_checks_run':34437828312,'main_published':False}
          (out/'release.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps({k:v for k,v in report.items() if k!='changed_files'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-header-release
          path: /tmp/pge-header-release/
          retention-days: 14
