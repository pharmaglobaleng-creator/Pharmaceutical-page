name: Fix Creamer manufacturer card hydration once

on:
  push:
    paths:
      - '.github/workflows/fix-creamer-card-hydration-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[fix-creamer-hydration]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Next flight data and add post-hydration safeguard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          rsc_files = [
              Path('parts/index.txt'),
              Path('parts/__next._full.txt'),
              Path('parts/__next.parts.$oc$catalog.__PAGE__.txt'),
          ]

          nav_kikusui = '["$","a","kikusui",{"href":"/parts/kikusui/","children":["Kikusui"," parts"]}]'
          nav_creamer = '["$","a","creamer",{"href":"/parts/cremer/","children":["Creamer"," parts"]}]'
          identify_marker = '["$","a",null,{"className":"pc-manufacturer-card pc-identify-card"'
          creamer_card = '["$","a","creamer",{"className":"pc-manufacturer-card","href":"/parts/cremer/","children":[["$","span",null,{"className":"pc-manufacturer-count","children":["2"," parts"]}],["$","span",null,{"className":"pc-manufacturer-mark","aria-hidden":"true","children":"CR"}],["$","h2",null,{"children":"Creamer"}],["$","p",null,{"children":"Browse Creamer replacement components by machine model, part name, and reference."}],["$","strong",null,{"children":["Browse replacement parts ",["$","span",null,{"aria-hidden":"true","children":"→"}]]}]]}]'

          for path in rsc_files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              original = text

              text = text.replace('"children":["3,471"," part records"]', '"children":["4,213"," part records"]')
              text = text.replace('"children":["4,211"," part records"]', '"children":["4,213"," part records"]')

              # Keep the existing published Manesty count aligned with the static catalog HTML.
              manesty_start = 0
              while True:
                  i = text.find('["$","a","manesty",', manesty_start)
                  if i < 0:
                      break
                  j = text.find('["$","a","kikusui",', i)
                  if j < 0:
                      j = min(len(text), i + 1800)
                  segment = text[i:j]
                  segment2 = segment.replace('"children":["260"," parts"]', '"children":["1,000"," parts"]', 1)
                  text = text[:i] + segment2 + text[j:]
                  manesty_start = i + len(segment2)

              # Add Creamer to both desktop and mobile manufacturer nav arrays.
              if nav_creamer not in text:
                  text = text.replace(nav_kikusui, nav_kikusui + ',' + nav_creamer)

              # Add the visible Creamer manufacturer card before the identify card.
              if '"className":"pc-manufacturer-card","href":"/parts/cremer/"' not in text:
                  grid_pos = text.find('"className":"pc-manufacturer-grid"')
                  ident_pos = text.find(identify_marker, grid_pos if grid_pos >= 0 else 0)
                  if ident_pos >= 0:
                      text = text[:ident_pos] + creamer_card + ',' + text[ident_pos:]

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  print('patched', path)
              else:
                  print('no changes', path)

          # Add a final browser-side safeguard AFTER Next hydration so the visible six-card
          # selection cannot fall back to the old five-manufacturer state.
          html_path = Path('parts/index.html')
          html = html_path.read_text(encoding='utf-8')
          if 'id="pge-creamer-selection-fix"' not in html:
              script = r'''<script id="pge-creamer-selection-fix">
          (function(){
            function syncCreamer(){
              var grid=document.querySelector('.pc-manufacturer-grid');
              if(!grid)return;
              var card=grid.querySelector('a[href="/parts/cremer/"]');
              var identify=grid.querySelector('.pc-identify-card');
              if(!card){
                card=document.createElement('a');
                card.className='pc-manufacturer-card';
                card.href='/parts/cremer/';
                card.innerHTML='<span class="pc-manufacturer-count">2 parts</span><span class="pc-manufacturer-mark" aria-hidden="true">CR</span><h2>Creamer</h2><p>Browse Creamer replacement components by machine model, part name, and reference.</p><strong>Browse replacement parts <span aria-hidden="true">→</span></strong>';
                if(identify)grid.insertBefore(card,identify);else grid.appendChild(card);
              }else{
                var h=card.querySelector('h2'); if(h)h.textContent='Creamer';
              }
              var total=document.querySelector('.pc-section-heading > span');
              if(total)total.textContent='4,213 part records';
              document.querySelectorAll('.pc-nav-menu div,.pc-mobile-nav nav').forEach(function(nav){
                var a=nav.querySelector('a[href="/parts/cremer/"]');
                if(!a){
                  a=document.createElement('a');a.href='/parts/cremer/';a.textContent='Creamer parts';
                  var id=nav.querySelector('a[href="/parts/identify/"]');
                  if(id)nav.insertBefore(a,id);else nav.appendChild(a);
                }else a.textContent='Creamer parts';
              });
            }
            [0,100,400,1000,2200].forEach(function(ms){setTimeout(syncCreamer,ms)});
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',syncCreamer,{once:true});else syncCreamer();
          })();
          </script>'''
              html = html.replace('</body>', script + '</body>')
              html_path.write_text(html, encoding='utf-8')
              print('added post-hydration safeguard')
          PY

          git config user.name "pharmaglobaleng-creator"
          git config user.email "pharmaglobaleng@gmail.com"
          git add parts/index.html parts/index.txt 'parts/__next._full.txt' 'parts/__next.parts.$oc$catalog.__PAGE__.txt'
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix Creamer card in hydrated parts manufacturer selection"
          git push
