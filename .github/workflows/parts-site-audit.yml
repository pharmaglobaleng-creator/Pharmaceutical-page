name: Expanded parts-site audit
on:
  push:
    branches: ['audit/parts-search-quality-20260909']
    paths:
      - 'scripts/audit_parts_site.py'
      - 'scripts/fix_parts_audit_findings.py'
      - '.github/workflows/parts-site-audit.yml'
      - 'parts/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: expanded-parts-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/audit/parts-search-quality-20260909'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /parts/
            /scripts/
            /catalog-data/
            /data/
            /docs/
            /robots.txt
            /sitemap.xml
            /sitemap-parts-images.xml
            /next-app/
            !/next-app/public/
            !/next-app/node_modules/
            /assets/js/
            /assets/css/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply narrowly scoped verified corrections
        run: python scripts/fix_parts_audit_findings.py
      - name: Verify corrections are idempotent
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          from fix_parts_audit_findings import apply
          assert apply()==[], 'Corrections must be idempotent'
          PY
      - name: Audit all parts HTML, links, assets and sitemaps
        run: python scripts/audit_parts_site.py --live
      - name: Validate structural and indexing safeguards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('audit-output/parts-audit-summary.json').read_text())
          critical=['invalid_jsonld','missing_title','missing_description','h1_count','canonical_mismatch','missing_product_schema','schema_sku_mismatch','schema_product_url_mismatch','missing_image_file','missing_script_or_stylesheet','placeholder_entity_name','schema_placeholder_entity']
          failures={k:j['checks'].get(k,0) for k in critical if j['checks'].get(k,0)}
          assert not failures, failures
          assert j['detail_pages']==4307, 'Preserve existing detail routes'
          print('Structural safeguard checks passed; review warnings remain separately reported.')
          PY
          git diff --check
      - name: Preserve source snapshot for independent review
        run: |
          python - <<'PY'
          import json,subprocess,zipfile
          from pathlib import Path
          inventory=subprocess.check_output(['git','ls-tree','-r','--name-only','HEAD'],text=True).splitlines()
          with zipfile.ZipFile('audit-output/source-snapshot.zip','w',zipfile.ZIP_DEFLATED) as z:
              for base in ['parts','scripts','catalog-data','data','docs','next-app','assets/js','assets/css']:
                  for p in Path(base).rglob('*'):
                      if p.is_file() and p.suffix in {'.py','.html','.json','.csv','.xml','.txt','.md','.ts','.tsx','.js','.mjs','.cjs','.css','.yml'} and 'node_modules' not in p.parts and 'public' not in p.parts:
                          z.write(p,p.as_posix())
              for name in ['robots.txt','sitemap.xml','sitemap-parts-images.xml']:
                  if Path(name).exists(): z.write(name)
              z.writestr('git-inventory.json',json.dumps(inventory))
          PY
      - name: Preserve complete audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expanded-parts-audit
          path: audit-output/
          retention-days: 14
      - name: Save corrections on audit branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audit_parts_site.py parts/korsch/korsch-300/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Correct unresolved Korsch category claims and audit homepage resolution'
          git push origin HEAD:audit/parts-search-quality-20260909
      - name: Display summary
        if: always()
        run: cat audit-output/parts-audit.md >> "$GITHUB_STEP_SUMMARY"
