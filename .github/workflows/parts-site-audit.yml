name: Expanded parts-site audit
on:
  push:
    branches: [main, 'audit/parts-search-quality-20260909']
    paths: ['parts/**', 'scripts/**', 'catalog-data/**', 'data/**', 'next-app/**', '.github/workflows/parts-site-audit.yml']
  pull_request:
    paths: ['parts/**', 'scripts/**', 'catalog-data/**', 'data/**', 'next-app/**', '.github/workflows/parts-site-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: expanded-parts-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /parts/
            /scripts/
            /catalog-data/
            /data/
            /docs/
            /robots.txt
            /sitemap.xml
            /sitemap-parts-images.xml
            /next-app/
            !/next-app/public/
            !/next-app/node_modules/
            /assets/js/
            /assets/css/
            /_next/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed corrections on the audit branch only
        if: github.ref == 'refs/heads/audit/parts-search-quality-20260909'
        run: |
          python scripts/fix_parts_audit_findings.py
          mkdir -p audit-output
          python scripts/finish_parts_audit.py > audit-output/corrections.json
      - name: Verify reference and navigation consistency without publication
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          from finish_parts_audit import apply
          result=apply()
          assert result['changed_files']==[], 'Source/reference corrections are required; see changed_files above.'
          PY
          node --check next-app/scripts/prepare-catalogs.mjs
      - name: Audit all parts HTML, links, assets and sitemaps
        run: python scripts/audit_parts_site.py --live
      - name: Validate structural safeguards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('audit-output/parts-audit-summary.json').read_text())
          assert not j['checks'], j['checks']
          assert j['detail_pages']==4307, 'Review any intentional route-count change explicitly'
          print('All implemented structural, reference and navigation checks passed.')
          PY
          git diff --check
      - name: Preserve source snapshot and patch for independent review
        run: |
          python - <<'PY'
          import json,subprocess,zipfile
          from pathlib import Path
          inventory=subprocess.check_output(['git','ls-tree','-r','--name-only','HEAD'],text=True).splitlines()
          Path('audit-output/corrections.patch').write_bytes(subprocess.check_output(['git','diff','--binary']))
          with zipfile.ZipFile('audit-output/source-snapshot.zip','w',zipfile.ZIP_DEFLATED) as z:
              for base in ['parts','scripts','catalog-data','data','docs','next-app','assets/js','assets/css','_next']:
                  for p in Path(base).rglob('*'):
                      if p.is_file() and p.suffix in {'.py','.html','.json','.csv','.xml','.txt','.md','.ts','.tsx','.js','.jsx','.mjs','.cjs','.css','.yml'} and 'node_modules' not in p.parts and 'public' not in p.parts:
                          z.write(p,p.as_posix())
              for name in ['robots.txt','sitemap.xml','sitemap-parts-images.xml']:
                  if Path(name).exists(): z.write(name)
              z.writestr('git-inventory.json',json.dumps(inventory))
          PY
      - name: Save corrections on audit branch only
        if: github.ref == 'refs/heads/audit/parts-search-quality-20260909'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- parts scripts catalog-data data/oem-cross-reference-audit.csv next-app/data/parts-catalog.json next-app/scripts/prepare-catalogs.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix Stokes manufacturer mismatch, Kikusui OEM exposure and legacy navigation'
          git push origin HEAD:audit/parts-search-quality-20260909
      - name: Preserve complete audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expanded-parts-audit
          path: audit-output/
          retention-days: 14
      - name: Display summary
        if: always()
        run: cat audit-output/parts-audit.md >> "$GITHUB_STEP_SUMMARY"
