name: Check Yandex verification and public search
on:
  push:
    branches: [agent/yandex-status-check-20260911]
    paths: [.github/workflows/yandex-status-check.yml]
permissions:
  contents: read
jobs:
  check:
    if: contains(github.event.head_commit.message, '[check-yandex]')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test existing key once and read public Yandex search
        env:
          INDEXNOW_KEY: 529d25100023d222289e11561b2213e1
        run: |
          python3 - <<'PY'
          import datetime, json, os, re
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError
          from urllib.parse import urlencode, urlsplit
          from urllib.robotparser import RobotFileParser
          SITE = 'https://pharmaglobaleng.com'
          TARGET = SITE + '/solutions/tablet-sticking.html'
          ENDPOINT = 'https://yandex.com/indexnow'
          KEY = os.environ['INDEXNOW_KEY']
          print('::add-mask::' + KEY)
          KEY_URL = SITE + '/' + KEY + '.txt'
          OUT = Path('yandex-status-evidence'); OUT.mkdir()
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = build_opener(NoRedirect)
          def fetch(url, data=None):
              headers = {'User-Agent':'PharmaGlobalEng-Status-Check/1.0'}
              if data is not None: headers['Content-Type'] = 'application/json; charset=utf-8'
              req = Request(url, data=data, headers=headers, method='POST' if data is not None else 'GET')
              try:
                  with opener.open(req, timeout=25) as r:
                      return r.status, dict(r.headers), r.read(2500000).decode('utf-8', errors='replace')
              except HTTPError as e:
                  return e.code, dict(e.headers), e.read(2500000).decode('utf-8', errors='replace')
          class HTML(HTMLParser):
              def __init__(self, text):
                  super().__init__(); self.canonical=[]; self.robots=[]; self.links=[]; self.text=[]; self.skip=0
                  self.feed(text)
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag in ('script','style'): self.skip += 1
                  if tag=='link' and 'canonical' in a.get('rel','').split(): self.canonical.append(a.get('href'))
                  if tag=='meta' and a.get('name','').lower() in ('robots','yandex','yandexbot'): self.robots.append(a.get('content',''))
                  if tag=='a' and a.get('href'): self.links.append(a['href'])
              def handle_endtag(self, tag):
                  if tag in ('script','style') and self.skip: self.skip -= 1
              def handle_data(self, data):
                  if not self.skip and data.strip(): self.text.append(data.strip())
          receipt = {'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                     'site':SITE,'workflow_run_id':os.environ['GITHUB_RUN_ID'],
                     'scope':'One updated public URL for the documented IndexNow key check; public search reads only. No production edits, account registration or whole-site resubmission.',
                     'previous_response':'202 on 2026-09-09; verification pending at that time',
                     'indexed_page_total':None,'indexing_confirmed':False,'authenticated_webmaster_access':False}
          try:
              ks,kh,kb=fetch(KEY_URL)
              receipt['key_file_http_status']=ks
              receipt['key_file_matches']=ks==200 and kb.strip()==KEY
              rs,rh,rb=fetch(SITE+'/robots.txt')
              robots=RobotFileParser(); robots.parse(rb.splitlines())
              receipt['robots_http_status']=rs
              receipt['robots_allows_test_url']=rs==200 and all(robots.can_fetch(agent,TARGET) for agent in ('Yandex','YandexBot'))
              ps,ph,pb=fetch(TARGET); page=HTML(pb)
              headers={k.lower():v for k,v in ph.items()}
              directives=','.join(page.robots+[headers.get('x-robots-tag','')]).lower()
              receipt['tested_page']={'url':TARGET,'http_status':ps,'canonical_matches':page.canonical==[TARGET],'explicit_noindex':bool(re.search(r'\b(?:noindex|none)\b',directives))}
              assert receipt['key_file_matches'] and receipt['robots_allows_test_url'], 'Live key or robots precheck failed; no POST sent.'
              assert ps==200 and page.canonical==[TARGET] and not receipt['tested_page']['explicit_noindex'], 'Page precheck failed; no POST sent.'
              receipt['post_attempted']=True
              payload=json.dumps({'host':'pharmaglobaleng.com','key':KEY,'keyLocation':KEY_URL,'urlList':[TARGET]}).encode()
              status,headers,body=fetch(ENDPOINT,payload)
              ct=next((v for k,v in headers.items() if k.lower()=='content-type'),'')
              receipt['indexnow']={'endpoint':ENDPOINT,'urls_sent':1,'http_status':status,'content_type':ct,'response_body':body[:1500].replace(KEY,'[redacted]')}
              valid_api_response='text/html' not in ct.lower() and not body.lstrip().startswith('<') and status in (200,202)
              receipt['indexnow']['key_verification']='confirmed' if valid_api_response and status==200 else 'pending' if valid_api_response and status==202 else 'not_confirmed'
              receipt['indexnow']['meaning']='Key verified; one updated URL received. This is not proof of indexing.' if valid_api_response and status==200 else 'Request received; key verification still pending. Indexing is not confirmed.' if valid_api_response and status==202 else 'Unexpected or rejected API response; key verification is not confirmed.'
          except Exception as e:
              receipt['verification_error']=str(e).replace(KEY,'[redacted]')
              if receipt.get('post_attempted') and 'indexnow' not in receipt: receipt['indexnow']={'key_verification':'response_unknown','warning':'No automatic retry made.'}
          searches=[]
          for label,query in [('domain','site:pharmaglobaleng.com'),('homepage','url:https://pharmaglobaleng.com/')]:
              url='https://yandex.com/search/?'+urlencode({'text':query})
              try:
                  status,headers,body=fetch(url)
                  parsed=HTML(body); text=' '.join(parsed.text)
                  location=next((v for k,v in headers.items() if k.lower()=='location'),'')
                  challenged=status!=200 or 'showcaptcha' in location.lower() or any(p in text.lower() for p in ('confirm you are not a robot','are you a robot','please confirm that you','captcha','подтвердите, что','доступ ограничен'))
                  links=sorted(set(u for u in parsed.links if urlsplit(u).netloc.lower() in ('pharmaglobaleng.com','www.pharmaglobaleng.com')))
                  searches.append({'query':query,'url':url,'http_status':status,'redirect':location[:300],
                                   'blocked_or_challenged':challenged,'direct_site_links_in_response':links if not challenged else [],
                                   'text_excerpt':text[:6500],
                                   'meaning':'Search response unavailable; cannot infer zero indexed pages.' if challenged else 'Public search snapshot only; not a complete indexed-page count.'})
                  (OUT/('public-search-'+label+'.html')).write_text(body,encoding='utf-8')
                  if challenged: break
              except Exception as e:
                  searches.append({'query':query,'error':str(e),'meaning':'Search retrieval failed; cannot infer zero indexed pages.'}); break
          receipt['public_search_checks']=searches
          receipt['completed_at_utc']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          report=json.dumps(receipt,indent=2,ensure_ascii=False)
          (OUT/'receipt.json').write_text(report+'\n',encoding='utf-8')
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write('# Yandex status check\n\n```json\n'+report+'\n```\n')
          PY
      - name: Save verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yandex-current-status-evidence
          path: yandex-status-evidence/
          retention-days: 30
