<style>.wrap{max-width:1120px;margin:auto;padding:0 24px}.landing-hero{padding:60px 0 42px;background:var(--bg-alt,#141c2d)}h1{font-size:clamp(2.1rem,5vw,3.7rem);line-height:1.12;max-width:900px}.lead{font-size:1.25rem;max-width:850px;line-height:1.65}.landing-content section{padding:36px 0;border-bottom:1px solid var(--line,#394150)}.landing-content{line-height:1.7}.landing-content nav{padding-top:24px}.landing-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.landing-grid article{padding:24px;border:1px solid var(--line,#394150);border-radius:12px}.landing-actions{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.landing-button{background:#215ad5;color:white;padding:14px 20px;border-radius:7px;display:inline-block;text-decoration:none;font-weight:700}.landing-button.secondary{background:transparent;border:1px solid currentColor;color:inherit}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:15px;border-bottom:1px solid var(--line,#394150);vertical-align:top}caption{text-align:left;font-weight:700;margin-bottom:12px}details{padding:16px 0;border-bottom:1px solid var(--line,#394150)}summary{font-weight:700;cursor:pointer}.small{font-size:.95rem}a:focus-visible,summary:focus-visible{outline:3px solid #68b9ff;outline-offset:4px}footer{padding:24px 0}@media(max-width:650px){.landing-grid{grid-template-columns:1fr}.landing-hero{padding-top:32px}.landing-button{width:100%;text-align:center;box-sizing:border-box}}.experience-panel{margin:24px 0 30px;padding:24px 28px;border:1px solid #416799;border-left:4px solid #5fbfff;border-radius:12px;background:#101e34;max-width:900px}.experience-panel .experience-eyebrow{margin:0 0 10px;color:#8ad5ff;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.85rem}.experience-panel h2{margin:0 0 14px;font-size:clamp(1.5rem,3vw,2rem);line-height:1.25}.experience-panel p{line-height:1.6}.experience-result{padding-top:14px;border-top:1px solid #3
