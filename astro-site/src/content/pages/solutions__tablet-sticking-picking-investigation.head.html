</style><script type="application/ld+json">{"@context": "https://schema.org", "@graph": [{"@type": "Article", "headline": "Tablet Sticking and Picking Investigation", "url": "https://pharmaglobaleng.com/solutions/tablet-sticking-picking-investigation.html", "mainEntityOfPage": "https://pharmaglobaleng.com/solutions/tablet-sticking-picking-investigation.html", "author": {"@type": "Person", "name": "Jim Demetro", "jobTitle": "Tablet Tooling Specialist", "description": "42 years of experience working with tablet tooling."}, "inLanguage": "en", "dateModified": "2026-10-17", "description": "Tablet sticking and picking investigation guide with 15 answers, evidence collection, trial records and a break-even calculator.", "version": "1.5", "about": {"@type": "Thing", "name": "Tablet Sticking and Picking Investigation"}}, {"@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "What is the difference between tablet sticking and picking?", "acceptedAnswer": {"@type": "Answer", "text": "Sticking involves material adhering to a punch face. Picking commonly describes localized adhesion associated with lettering or other engraved details. Record the location and appearance of the defect before choosing an investigation route."}}, {"@type": "Question", "name": "Does powder inside punch numbers mean I need a new coating?", "acceptedAnswer": {"@type": "Answer", "text": "No. Engraving geometry, surface condition, formulation and process conditions can all warrant review. A coating candidate needs evaluation against the actual product and tooling requirements."}}, {"@type": "Question", "name": "Can polishing restore every worn punch?", "acceptedAnswer": {"@type": "Answer", "text": "No. The decision depends on inspection, dimensions, tip geometry and the nature of any damage. An acceptable finish does not by itself establish that a tool is suitable for production."}}, {"@type": "Question", "name": "Can this calculator prove a tooling treatment will work?", "acceptedAnswer": {"@type": "Answer", "text": "No. It calculates the consequences of assumptions you enter. A controlled trial must establish whether performance improves while the required product-quality attributes remain acceptable."}}, {"@type": "Question", "name": "Are recovered production hours the same as cash savings?", "acceptedAnswer": {"@type": "Answer", "text": "No. Recovered capacity may have value, but it is not cash saved automatically. Labor allocations may also remain payable. Confirm which costs are genuinely avoidable before making an investment decision."}}, {"@type": "Question", "name": "What should I send for an initial assessment?", "acceptedAnswer": {"@type": "Answer", "text": "Provide the press and tooling reference, a description of the defect, affected tool IDs, clear photographs, recurrence timing and relevant inspection history. Share sensitive product information only through your approved company process."}}, {"@type": "Question", "name": "How should I compare a trial with the baseline?", "acceptedAnswer": {"@type": "Answer", "text": "Define the observation period and measures before the trial. Record comparable batches, stop duration, rejected quantity and quality results; document other changes that could affect the comparison."}}, {"@type": "Question", "name": "Can I reuse the worksheet?", "acceptedAnswer": {"@type": "Answer", "text": "You may reuse this page\u2019s original evidence matrix and blank worksheet internally or reproduce them with credit to PharmaGlobalEng and a link to the published resource. Linked third-party materials remain subject to their owners\u2019 terms."}}, {"@type": "Question", "name": "What should a tablet sticking and picking investigation record first?", "acceptedAnswer": {"@type": "Answer", "text": "Record the product and batch reference, press, tooling set, affected station IDs, defect location and when it first appears. Pair tablet photographs with punch-face observations. This creates a traceable starting point for comparing affected and acceptable runs; it does not establish the cause by itself."}}, {"@type": "Question", "name": "Can a tablet photograph identify the root cause?", "acceptedAnswer": {"@type": "Answer", "text": "A photograph documents appearance, not causation. Similar visible defects can require different investigations. Preserve the original image and connect it to tool identity, process records and inspection findings. The illustrative images in this guide are teaching aids, not measured customer results or acceptance standards."}}, {"@type": "Question", "name": "Why record recurrence after punch cleaning?", "acceptedAnswer": {"@type": "Answer", "text": "Recurrence records distinguish a temporary improvement after cleaning from a sustained change. Record the approved cleaning method and the elapsed time, tablets or batches until the defect returns. Compare like-for-like runs rather than treating a clean-looking punch as evidence that the underlying problem has been resolved."}}, {"@type": "Question", "name": "Why compare defect rates instead of total counts?", "acceptedAnswer": {"@type": "Answer", "text": "Counts depend on how much production was observed. Twenty stops in ten comparable batches is two stops per batch; twenty stops in twenty batches is one. Choose a denominator appropriate to the comparison, and also record batch size, stop duration and rejects so a lower rate is not mistaken for a complete improvement."}}, {"@type": "Question", "name": "What does the break-even stop reduction mean?", "acceptedAnswer": {"@type": "Answer", "text": "It is the modeled reduction in stop-linked avoidable cash costs needed to recover the one-time investment within the selected 6-, 12- or 24-month horizon. Mid-case reject savings and other savings remain fixed. The threshold is a financial target based on your inputs, not a prediction of treatment effectiveness."}}, {"@type": "Question", "name": "Why does changing currency leave the calculated numbers unchanged?", "acceptedAnswer": {"@type": "Answer", "text": "The currency selector changes the currency label and formatting; it does not apply exchange rates. Enter every cost in the same currency before comparing cases. Mixing currencies in one scenario produces a misleading financial result even if the arithmetic is internally consistent."}}, {"@type": "Question", "name": "Which records belong in a tooling assessment handover?", "acceptedAnswer": {"@type": "Answer", "text": "Include the problem description, tool and station map, dated photographs, baseline production measures, inspection history and proposed trial criteria. Separate observed facts from assumptions. Share only information approved for disclosure and use the workbook to retain baseline, planned-trial and measured-outcome records."}}]}]}</script></head>
