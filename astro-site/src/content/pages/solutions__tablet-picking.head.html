<script id="pge-visible-faq-schema" type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "@id": "https://pharmaglobaleng.com/solutions/tablet-picking.html#faq", "mainEntity": [{"@type": "Question", "name": "Why is powder picking out numbers on tablet surfaces?", "acceptedAnswer": {"@type": "Answer", "text": "If material is missing around a number and retained on the corresponding punch detail, tablet picking may be involved. Compare both surfaces, the approved drawing and the timing of the defect. A poorly defined number alone does not prove picking or identify its cause."}}, {"@type": "Question", "name": "Does a picking remedy differ for embossed and debossed numbers?", "acceptedAnswer": {"@type": "Answer", "text": "Identify whether the number is raised or recessed on the tablet and compare it with the corresponding punch geometry. Those descriptions do not establish a remedy by themselves. Review the affected feature, surface condition and approved design before choosing tooling work."}}, {"@type": "Question", "name": "Can polishing correct picking around a tablet number?", "acceptedAnswer": {"@type": "Answer", "text": "Controlled polishing may be considered when inspection finds recoverable surface damage and the approved numeral geometry can be preserved. It cannot be assumed to correct unsuitable geometry or a formulation-related cause. Confirm the scope and acceptance checks before work."}}, {"@type": "Question", "name": "What causes tablet picking around logos?", "acceptedAnswer": {"@type": "Answer", "text": "Picking around a logo involves local material loss with product retained at the matching punch detail. Inspect deposits, damage, enclosed character areas and transitions against the approved drawing, and compare affected tools with acceptable ones. Surface condition, engraving geometry and formulation can interact. Select cleaning, surface work, coating evaluation or design review from the evidence rather than automatically applying a coating."}}, {"@type": "Question", "name": "Are five good tablets after cleaning enough to close the investigation?", "acceptedAnswer": {"@type": "Answer", "text": "They document that sample, not the rest of the run. Use the sampling plan and observation period agreed by your manufacturing and quality teams, including the period when the original problem normally appeared."}}, {"@type": "Question", "name": "What should I send for a preliminary review?", "acceptedAnswer": {"@type": "Answer", "text": "Send both tablet faces, the corresponding punch detail, the press model, tooling identification, coating records and the time the defect appears. Include what has already been tried and whether it changed the pattern."}}]}</script>
